[project]
name = "abalone-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Maximo Zanetta", email = "maximozanetta@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
